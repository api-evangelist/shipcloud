aid: shipcloud

name: shipcloud

description: shipcloud (shipcloud GmbH) is a German multi-carrier shipping platform that lets online shops, apps and services create shipments,
  print labels, request pickups and track parcels across many carriers through a single REST API. Its developer portal at developers.shipcloud.io
  offers concepts, carrier-specific guides, integration tools, examples, an API reference and an OpenAPI spec, with a free developer plan for
  testing.

