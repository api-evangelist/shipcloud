headers:
- name: RateLimit-Limit
  description: number the shows the overall limit of requests this user can send (e.g. 120)
- name: RateLimit-Interval
  description: number of seconds the interval for this user is long (e.g. 60)
- name: RateLimit-Remaining
  description: remaining number of request in the current interval (e.g. 111)
- name: RateLimit-Reset
  description: number of seconds that shows when the request rate limit resets (e.g. 42)
