name: shipcloud MCP (candidate)
type: MCPServer
generated: '2026-10-09'
method: derived
source: openapi/shipcloud-openapi.yml
status: candidate
description: No official shipcloud-published MCP server was found (web search 2026-10-09; developers.shipcloud.io/llms.txt and /AGENTS.md answered 403). This is a candidate tool list derived 1:1 from the
  33 operations of the shipcloud v1 OpenAPI. The spec ships no operationIds, so tool bindings use METHOD + path, with proposed operationIds taken from overlays/shipcloud-api-overlay.yaml.
deployment:
  mode: none
  auth: unknown
  verified: derived
api_auth:
  scheme: HTTP Basic (API key as username)
  base_url: https://api.shipcloud.io/v1
third_party_servers:
- name: Pipedream shipcloud MCP
  url: https://mcp.pipedream.com/app/shipcloud
  official: false
  verified: searched
- name: Boost.space shipcloud integration (MCP view)
  url: https://web-2025.boost.space/integrations/shipcloud/?view=mcp
  official: false
  verified: searched
- name: AnythingMCP shipcloud connector
  url: https://anythingmcp.com/guides/shipcloud-to-mcp
  official: false
  verified: searched
